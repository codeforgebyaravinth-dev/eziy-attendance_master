name: Build Windows Desktop App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet Packages
      run: dotnet restore windows-desktop/EziyAttendanceMaster/EziyAttendanceMaster.sln

    - name: Build & Publish Standalone Windows Executable
      run: |
        dotnet publish windows-desktop/EziyAttendanceMaster/EziyAttendanceMaster/EziyAttendanceMaster.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -o ./dist/publish

    - name: Upload Windows Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EziyAttendanceMaster-Windows-x64
        path: ./dist/publish/

